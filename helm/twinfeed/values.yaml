# Default values for twinfeed.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  backend:
    repository: ghcr.io/mrowling/feeding-tracker-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  frontend:
    repository: ghcr.io/mrowling/feeding-tracker-frontend
    pullPolicy: IfNotPresent
    tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

backend:
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  env:
    GIN_MODE: "release"
    DB_PATH: "/data/twinfeed.db"
    PORT: "8080"
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    annotations: {}
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 250m
    #   memory: 256Mi

frontend:
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  env:
    VITE_API_URL: ""  # Will be set dynamically to backend service
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 50m
    #   memory: 64Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: twinfeed.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: twinfeed-tls
  #    hosts:
  #      - twinfeed.example.com

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Global configuration
global:
  # Image tag override for both frontend and backend
  imageTag: ""
  # Image pull policy override
  imagePullPolicy: ""
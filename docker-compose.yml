services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: twinfeed-backend
    ports:
      - "8080:8080"
    volumes:
      - backend_data:/data
    environment:
      - GIN_MODE=release
      - DB_PATH=/data/twinfeed.db
      - PORT=8080
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: twinfeed-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
    driver: local
services:
  backend:
    # Production deployment using GitHub Container Registry
    # Use RELEASE_TAG environment variable to specify version, defaults to latest
    image: ghcr.io/mrowling/twinfeed-backend:${RELEASE_TAG:-latest}
    container_name: twinfeed-backend
    ports:
      - "8080:8080"
    volumes:
      - backend_data:/data
    environment:
      - GIN_MODE=release
      - DB_PATH=/data/twinfeed.db
      - PORT=8080
    restart: unless-stopped

  frontend:
    # Production deployment using GitHub Container Registry
    # Use RELEASE_TAG environment variable to specify version, defaults to latest
    image: ghcr.io/mrowling/twinfeed-frontend:${RELEASE_TAG:-latest}
    container_name: twinfeed-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
    driver: local
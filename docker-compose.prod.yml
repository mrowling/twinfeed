services:
  backend:
    # Production deployment using GitHub Container Registry
    image: ghcr.io/mrowling/feeding-tracker-backend:latest
    container_name: twinfeed-backend
    ports:
      - "8080:8080"
    volumes:
      - backend_data:/data
    environment:
      - GIN_MODE=release
      - DB_PATH=/data/twinfeed.db
      - PORT=8080
    restart: unless-stopped

  frontend:
    # Production deployment using GitHub Container Registry
    image: ghcr.io/mrowling/feeding-tracker-frontend:latest
    container_name: twinfeed-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
    driver: local
name: Dependencies Update

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # Allow manual triggering

jobs:
  update-go-dependencies:
    name: Update Go Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Update Go dependencies
        working-directory: ./backend
        run: |
          go get -u ./...
          go mod tidy

      - name: Run tests to ensure compatibility
        working-directory: ./backend
        run: go test ./... -v

      - name: Create PR for Go dependencies
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update Go dependencies"
          title: "🔄 Update Go Dependencies"
          body: |
            ## 🔄 Automated Go Dependencies Update

            This PR updates Go dependencies to their latest versions.

            ### Changes
            - Updated all Go modules to latest compatible versions
            - Ran `go mod tidy` to clean up dependencies
            - All tests pass with updated dependencies

            ### Testing
            - [x] Backend tests pass
            - [x] Dependencies are compatible

            **Auto-generated by GitHub Actions**
          branch: chore/update-go-deps
          delete-branch: true

  update-node-dependencies:
    name: Update Node Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Update Node dependencies
        working-directory: ./frontend
        run: |
          pnpm update --latest
          pnpm install

      - name: Run tests to ensure compatibility
        working-directory: ./frontend
        run: |
          pnpm type-check
          pnpm lint
          pnpm test --run

      - name: Try building to ensure compatibility
        working-directory: ./frontend
        run: pnpm build

      - name: Create PR for Node dependencies
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update Node.js dependencies"
          title: "🔄 Update Node.js Dependencies"
          body: |
            ## 🔄 Automated Node.js Dependencies Update

            This PR updates Node.js dependencies to their latest versions.

            ### Changes
            - Updated all npm packages to latest compatible versions
            - All tests pass with updated dependencies
            - Build succeeds with updated dependencies

            ### Testing
            - [x] Frontend tests pass
            - [x] TypeScript compilation succeeds
            - [x] Linting passes
            - [x] Build succeeds

            **Auto-generated by GitHub Actions**
          branch: chore/update-node-deps
          delete-branch: true
